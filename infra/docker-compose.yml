services:
  server:
    build:
      context: ../server
      dockerfile: ../infra/docker/server.Dockerfile
    env_file: ../server/.env
    environment:
      DATABASE_URL: sqlite:////data/homie.db
    volumes:
      - homie-data:/data
    ports: ["8000:8000"]

  client:
    build:
      context: ../client
      dockerfile: ../infra/docker/client.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [server]

volumes:
  homie-data:
