services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    # The image runs as uid 1000 but a new named volume is root-owned.
    user: root
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports: ["8001:8000"]

  server:
    build:
      context: ../server
      dockerfile: ../infra/docker/server.Dockerfile
    env_file: ../server/.env
    environment:
      AWS_REGION: us-east-1
      DYNAMODB_TABLE: homie-local
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports: ["8000:8000"]
    depends_on: [dynamodb]

  client:
    build:
      context: ../client
      dockerfile: ../infra/docker/client.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [server]

volumes:
  dynamodb-data:
